name: Quality gate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-gate-main
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installazione pulita
        run: npm ci
      - name: Test e compilazione
        run: npm test
      - name: Browser Chromium
        run: npx playwright install --with-deps chromium
      - name: Flussi UI critici
        run: npm run test:ui-critical

name: Remote access gate

on:
  push:
    branches:
      - codex/remote-access-gate-1-33-1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  access-boundary:
    name: Public password session boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_BASE_URL: https://516511b3.viaggio-in-india-2026-qa.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install remote browser
        run: npm install --no-save --ignore-scripts playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run level-zero access gate
        run: node remote-tests/access-gate.mjs

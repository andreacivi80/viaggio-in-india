name: Remote access gate

on:
  push:
    branches:
      - codex/remote-access-gate-1-33-1
      - codex/qa-candidate-1-33-1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-capability:
    name: Remote QA deployment capability
    runs-on: ubuntu-latest
    steps:
      - name: Check remote credentials without exposing values
        env:
          CF_TOKEN_AVAILABLE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' || secrets.CF_API_TOKEN != '' }}
          CF_ACCOUNT_AVAILABLE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' || secrets.CF_ACCOUNT_ID != '' }}
        run: |
          echo "cloudflare_token_available=${CF_TOKEN_AVAILABLE}"
          echo "cloudflare_account_available=${CF_ACCOUNT_AVAILABLE}"

  isolated-pages-api:
    name: Isolated Pages D1 API boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE_URL: http://127.0.0.1:8788
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application
        run: npm ci
      - name: Build candidate
        run: npm run build
      - name: Initialize isolated D1
        run: npx -y wrangler@4.33.0 d1 execute viaggio-in-india-qa-db --local --config wrangler.qa.jsonc --file db/schema.sql
      - name: Start isolated Pages runtime
        run: |
          cp wrangler.qa.jsonc wrangler.jsonc
          npx -y wrangler@4.33.0 pages dev dist --port 8788 --binding GROUP_CODE=india26 > /tmp/india-pages.log 2>&1 &
          for attempt in {1..45}; do
            curl --fail --silent http://127.0.0.1:8788/api/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/india-pages.log
          exit 1
      - name: Run real API authorization gate
        run: node remote-tests/api-gate.mjs

  deployed-qa:
    name: Deployed QA access boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_BASE_URL: https://516511b3.viaggio-in-india-2026-qa.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install remote browser
        run: npm install --no-save --ignore-scripts playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run deployed QA gate
        run: node remote-tests/access-gate.mjs

  corrected-candidate:
    name: Corrected candidate access boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_BASE_URL: http://127.0.0.1:5173/viaggio-in-india/
      MOCK_API: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application
        run: npm ci
      - name: Run isolated unit gate
        run: node --test tests/access-flow.test.mjs tests/access-storage.test.mjs tests/file-validation.test.mjs tests/media-validation.test.mjs tests/migration-safety.test.mjs tests/offline-queue.test.mjs tests/public-cache.test.mjs tests/resumable-upload.test.mjs
      - name: Build candidate
        run: npm run build
      - name: Install remote browser
        run: npm install --no-save --ignore-scripts playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start candidate
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/india-vite.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:5173/viaggio-in-india/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/india-vite.log
          exit 1
      - name: Run corrected candidate gate
        run: node remote-tests/access-gate.mjs
